version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/backend/Financas.Api
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencias, api]
    open-pull-requests-limit: 5

  # #231: os módulos do back-end em Go (ADR 0049).
  - package-ecosystem: gomod
    directory: /src/backend-go
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencias, api]
    open-pull-requests-limit: 5

  # #451: o gerenciador em Go (ADR 0052), um módulo à parte. O Wails sai versão prévia quase todo dia e só sobe num PR
  # próprio, com o teste de instalação passando (ADR 0052): fica fora daqui.
  - package-ecosystem: gomod
    directory: /src/gerenciador-go
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencias]
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3

  - package-ecosystem: npm
    directory: /src/frontend
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencias, web]
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: develop
    labels: [dependencias, ci]
