# Testa a instalacao pelos scripts bash (scripts/geral/instalar.sh = etapas 1, 2 e 3) num Linux de
# verdade. O runner ja traz dotnet, node, go e sqlite3 em /usr/bin, entao reduzir o PATH nao basta:
# o teste monta uma pasta com todos os comandos do sistema MENOS esses (e python3/jq, para provar
# que os scripts nao dependem deles) e usa so ela no PATH. Assim tudo e baixado, como num
# computador novo. O servico roda no systemd --user, como numa instalacao real.
name: Teste de instalação no Linux

on:
  push:
    branches: [main, develop]
    paths:
      - scripts/geral/**
      - scripts/linux/**
      - banco/**
      - src/gerenciador/**
      - src/gerenciador-go/**
      - src/backend-go/go.mod
      - .github/workflows/teste-instalacao-linux.yml
  pull_request:
    branches: [main, develop]
    paths:
      - scripts/geral/**
      - scripts/linux/**
      - banco/**
      - src/gerenciador/**
      - src/gerenciador-go/**
      - src/backend-go/go.mod
      - .github/workflows/teste-instalacao-linux.yml
  workflow_dispatch:

permissions:
  contents: read

# "shell: bash" explicito liga o pipefail: sem ele, uma falha antes do "| tee" passaria batido.
defaults:
  run:
    shell: bash

concurrency:
  group: teste-instalacao-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instalar:
    name: instalar e atualizar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PATH sem dotnet, node, go, sqlite3 e python
        run: |
          limpo="$RUNNER_TEMP/bin-limpo"
          mkdir -p "$limpo"
          for arq in /usr/bin/* /bin/* /usr/sbin/* /sbin/*; do
            nome="$(basename "$arq")"
            case "$nome" in
              dotnet|node|nodejs|npm|npx|corepack|go|gofmt|sqlite3|python|python3|python3.*|jq) continue ;;
            esac
            [[ -e "$limpo/$nome" ]] || ln -s "$arq" "$limpo/$nome"
          done
          echo "PATH_LIMPO=$limpo" >> "$GITHUB_ENV"
          for cmd in dotnet node go sqlite3 python3 jq; do
            if PATH="$limpo" command -v "$cmd" >/dev/null; then echo "::error::$cmd ainda visivel"; exit 1; fi
          done

      # systemd --user precisa de uma sessao do usuario; o linger cria uma sem login.
      - name: Habilitar systemd --user
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          for _ in $(seq 1 30); do [[ -S "/run/user/$uid/bus" ]] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"

      - name: Instalacao do zero (instalar.sh)
        run: env PATH="$PATH_LIMPO" bash scripts/geral/instalar.sh 2>&1 | tee "$RUNNER_TEMP/instalacao-1.log"

      - name: Conferir instalacao
        run: |
          for p in ferramentas/node/bin/node ferramentas/dotnet/dotnet ferramentas/go/bin/go ferramentas/sqlite/sqlite3 \
                   dados/sql/FinancasLocal.db dados/chaves/financaslocal.pfx \
                   publicado/api/Financas.Api.dll publicado/api/financas-go publicado/api/wwwroot/index.html \
                   publicado/api/appsettings.Production.json; do
            [[ -e "$p" ]] || { echo "::error::nao encontrado: $p"; exit 1; }
          done
          systemctl --user is-active --quiet financaslocal.service || { echo "::error::servico nao esta ativo"; exit 1; }
          curl -k -fsS https://127.0.0.1:5443/api/auth/estado

      # #231 (ADR 0049): o Go roda atras do .NET, como processo filho do servico, e responde pelo repasse.
      - name: Go atras do .NET (/api/go/saude)
        run: |
          site=https://127.0.0.1:5443
          c="$RUNNER_TEMP/cookies.txt"
          curl -k -fsS -c "$c" -b "$c" "$site/api/auth/estado" >/dev/null
          token() { awk '$6 == "__Host-XSRF-TOKEN" { print $7 }' "$c" | tail -n1; }
          curl -k -fsS -c "$c" -b "$c" -H "X-XSRF-TOKEN: $(token)" -H 'Content-Type: application/json' \
            -d '{"login":"verificador","senha":"Teste#Linux2026"}' "$site/api/auth/configurar" >/dev/null
          [[ "$(curl -k -s -o /dev/null -w '%{http_code}' "$site/api/go/saude")" == 401 ]] || { echo "::error::sem login devia ser 401"; exit 1; }
          saude=""
          for _ in $(seq 1 15); do saude="$(curl -k -fsS -b "$c" "$site/api/go/saude" || true)"; [[ -n "$saude" ]] && break; sleep 2; done
          echo "$saude"
          [[ "$saude" == *'"usuario":"verificador"'* && "$saude" == *'"diarioDoBanco":"wal"'* ]] || { echo "::error::GET /api/go/saude: $saude"; exit 1; }
          pid_api="$(systemctl --user show -p MainPID --value financaslocal.service)"
          pgrep -P "$pid_api" -f publicado/api/financas-go >/dev/null || { echo "::error::o Go nao e processo filho do servico"; pgrep -af financas; exit 1; }

      # Gerenciador do Linux (#277, ADR 0052): sem o GTK 4 e o WebKitGTK 6.0, o script avisa o que falta e instala o
      # em C# (ADR 0033), como antes; com eles, compila o em Go. Os dois respondem ao --situacao, que usa o systemd do
      # usuario e /api/auth/estado sem abrir janela (o runner nao tem tela).
      - name: Gerenciador sem as bibliotecas do em Go (instalar-gerenciador.sh)
        run: |
          if pkg-config --exists webkitgtk-6.0 2>/dev/null; then echo "::error::o runner ja tem o WebKitGTK 6.0: o caso sem ele nao e testado"; exit 1; fi
          env PATH="$PATH_LIMPO" bash scripts/linux/instalar-gerenciador.sh 2>&1 | tee "$RUNNER_TEMP/instalacao-gerenciador.log"
          grep -q 'sudo apt install gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev' "$RUNNER_TEMP/instalacao-gerenciador.log" || { echo "::error::o script nao disse o que instalar"; exit 1; }
          exe="$PWD/publicado/gerenciador/Financas.Gerenciador.Linux"
          atalho="$HOME/.local/share/applications/financaslocal-gerenciador.desktop"
          for p in "$exe" publicado/gerenciador/icone.png "$atalho"; do
            [[ -e "$p" ]] || { echo "::error::nao encontrado: $p"; exit 1; }
          done
          grep -qF "Exec=\"$exe\"" "$atalho" || { echo "::error::o atalho nao aponta para o gerenciador"; cat "$atalho"; exit 1; }
          "$exe" --situacao | tee "$RUNNER_TEMP/situacao.txt"
          grep -q 'O site está no ar' "$RUNNER_TEMP/situacao.txt" || { echo "::error::o gerenciador nao viu o site no ar"; exit 1; }
          # "Iniciar com o sistema" ligado no em C#: a troca para o em Go tem de levar junto.
          mkdir -p "$HOME/.config/autostart"
          { echo '[Desktop Entry]'; echo 'Type=Application'; echo "Exec=\"$exe\" --bandeja"; } > "$HOME/.config/autostart/financaslocal-gerenciador.desktop"

      - name: Gerenciador em Go (instalar-gerenciador.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
          env PATH="$PATH_LIMPO" bash scripts/linux/instalar-gerenciador.sh 2>&1 | tee "$RUNNER_TEMP/instalacao-gerenciador-go.log"
          exe="$PWD/publicado/gerenciador-go/financas-gerenciador"
          atalho="$HOME/.local/share/applications/br.financaslocal.Gerenciador.desktop"
          for p in "$exe" publicado/gerenciador-go/icone.png "$atalho"; do
            [[ -e "$p" ]] || { echo "::error::nao encontrado: $p"; exit 1; }
          done
          grep -qF "Exec=\"$exe\"" "$atalho" || { echo "::error::o atalho nao aponta para o gerenciador em Go"; cat "$atalho"; exit 1; }
          grep -qF "Icon=$PWD/publicado/gerenciador-go/icone.png" "$atalho" || { echo "::error::o atalho sem o icone"; cat "$atalho"; exit 1; }
          [[ ! -e "$HOME/.local/share/applications/financaslocal-gerenciador.desktop" ]] || { echo "::error::sobrou o atalho do em C# no menu"; exit 1; }
          grep -qF "Exec=\"$exe\" --bandeja" "$HOME/.config/autostart/financaslocal-gerenciador.desktop" || { echo "::error::o iniciar com o sistema nao passou para o em Go"; cat "$HOME/.config/autostart/financaslocal-gerenciador.desktop"; exit 1; }
          "$exe" --situacao | tee "$RUNNER_TEMP/situacao-go.txt"
          grep -q 'O site está no ar' "$RUNNER_TEMP/situacao-go.txt" || { echo "::error::o gerenciador em Go nao viu o site no ar"; exit 1; }
          grep -q "Gerenciador: $(grep -o '<Version>[^<]*' Directory.Build.props | head -n1 | cut -d'>' -f2)" "$RUNNER_TEMP/situacao-go.txt" || { echo "::error::versao do gerenciador"; exit 1; }

      - name: Atualizacao (instalar.sh --pular-build)
        run: |
          env PATH="$PATH_LIMPO" bash scripts/geral/instalar.sh --pular-build 2>&1 | tee "$RUNNER_TEMP/instalacao-2.log"
          grep -q 'certificado existente reaproveitado' "$RUNNER_TEMP/instalacao-2.log" || { echo "::error::certificado nao foi reaproveitado"; exit 1; }
          grep -q 'servico systemd (usuario) atualizado e reiniciado' "$RUNNER_TEMP/instalacao-2.log" || { echo "::error::servico nao foi reiniciado"; exit 1; }
          ls backups/FinancasLocal-antes-instalacao-*.db || { echo "::error::backup do banco antes da atualizacao nao foi feito"; exit 1; }
          curl -k -fsS https://127.0.0.1:5443/api/auth/estado

      # #84 (ADR 0049): o Go sozinho como servico, sem o .NET, e a unidade volta como estava. Na inversao (#85), quem
      # escreve a unidade e o 3-publicar-atualizar.sh, no ponto unico do executavel.
      - name: Go sozinho como servico (systemd)
        run: |
          site=https://127.0.0.1:5443/api/auth/estado
          unidade="$HOME/.config/systemd/user/financaslocal.service"
          diario() { sudo journalctl _SYSTEMD_USER_UNIT=financaslocal.service --no-pager; }
          cp "$unidade" "$RUNNER_TEMP/unidade-do-dotnet"
          systemctl --user stop financaslocal.service
          sed -i "s|^ExecStart=.*|ExecStart=$PWD/publicado/api/financas-go -aplicar-esquema -rotinas-de-partida|" "$unidade"
          systemctl --user daemon-reload
          systemctl --user start financaslocal.service

          resposta=""
          for _ in $(seq 1 30); do resposta="$(curl -k -fsS "$site" || true)"; [[ -n "$resposta" ]] && break; sleep 1; done
          [[ -n "$resposta" ]] || { echo "::error::o Go sozinho nao respondeu"; diario | tail -30; exit 1; }
          echo "$resposta"
          pid="$(systemctl --user show -p MainPID --value financaslocal.service)"
          [[ "$(cat "/proc/$pid/comm")" == financas-go ]] || { echo "::error::o servico nao e o Go: $(cat "/proc/$pid/comm")"; exit 1; }
          if pgrep -f Financas.Api.dll; then echo "::error::o .NET continua rodando"; exit 1; fi
          for _ in $(seq 1 10); do diario | grep -q 'iniciando sozinho' && break; sleep 1; done
          diario | grep -q 'iniciando sozinho' || { echo "::error::o log do Go nao chegou ao journald"; diario | tail -30; exit 1; }

          systemctl --user stop financaslocal.service
          if pgrep -af publicado/api/financas-go; then echo "::error::sobrou processo do Go com o servico parado"; exit 1; fi
          resultado="$(systemctl --user show -p Result --value financaslocal.service)"
          [[ "$resultado" == success ]] || { echo "::error::o Go parou com $resultado"; diario | tail -30; exit 1; }

          cp "$RUNNER_TEMP/unidade-do-dotnet" "$unidade"
          systemctl --user daemon-reload
          systemctl --user start financaslocal.service
          for _ in $(seq 1 30); do curl -k -fsS "$site" && break; sleep 1; done
          curl -k -fsS "$site"

      - name: Backup (4-backup.sh)
        run: |
          env PATH="$PATH_LIMPO" bash scripts/geral/4-backup.sh
          ls backups/FinancasLocal_*.db

      # #468: o passo a passo do docs/OPERACAO.md: a copia volta, e o que veio depois dela sai.
      - name: Restaurar a copia (docs/OPERACAO.md)
        run: |
          sqlite=ferramentas/sqlite/sqlite3
          banco=dados/sql/FinancasLocal.db
          copia="$(ls -t backups/FinancasLocal_*.db | head -1)"
          "$sqlite" "$banco" "INSERT INTO Configuracao (Chave, Valor, AtualizadoEm) VALUES ('teste.depois-da-copia', 'x', '2026-01-01 00:00:00');"

          systemctl --user stop financaslocal.service
          mkdir -p dados/antes-de-restaurar
          cp "$banco"* dados/antes-de-restaurar/
          cp "$copia" "$banco"
          rm -f "$banco-wal" "$banco-shm"
          systemctl --user start financaslocal.service

          for _ in $(seq 1 30); do curl -k -fsS https://127.0.0.1:5443/api/auth/estado && break; sleep 1; done
          curl -k -fsS https://127.0.0.1:5443/api/auth/estado
          marcas="$("$sqlite" "$banco" "SELECT COUNT(*) FROM Configuracao WHERE Chave = 'teste.depois-da-copia';")"
          [[ "$marcas" == 0 ]] || { echo "::error::a copia nao voltou: $marcas marca(s) no banco"; exit 1; }
          [[ "$("$sqlite" "$banco" 'PRAGMA integrity_check;')" == ok ]] || { echo "::error::banco corrompido depois de restaurar"; exit 1; }
          [[ -e dados/antes-de-restaurar/FinancasLocal.db ]] || { echo "::error::o banco de antes nao foi guardado"; exit 1; }

      - name: Parar (parar.sh --desativar)
        run: |
          env PATH="$PATH_LIMPO" bash scripts/geral/parar.sh --desativar
          if systemctl --user is-active --quiet financaslocal.service; then echo "::error::servico continua ativo"; exit 1; fi
          estado="$(systemctl --user is-enabled financaslocal.service || true)"
          [[ "$estado" == disabled ]] || { echo "::error::servico continua habilitado ($estado)"; exit 1; }
          if curl -k -fsS https://127.0.0.1:5443/api/auth/estado; then echo "::error::API continua respondendo"; exit 1; fi
          if publicado/gerenciador-go/financas-gerenciador --situacao; then echo "::error::o gerenciador diz que o site esta no ar"; exit 1; fi
          if pgrep -af publicado/api/financas-go; then echo "::error::sobrou processo do Go com o servico parado"; exit 1; fi

      - name: Subir de novo (3-publicar-atualizar.sh --pular-build)
        run: |
          env PATH="$PATH_LIMPO" bash scripts/geral/3-publicar-atualizar.sh --pular-build
          systemctl --user is-enabled --quiet financaslocal.service || { echo "::error::servico nao voltou a ser habilitado"; exit 1; }
          curl -k -fsS https://127.0.0.1:5443/api/auth/estado

      # ADR 0040: o atualizar.sh e so para clone no develop. Em PR o checkout fica fora do develop (tem de recusar, 2);
      # no push do develop ja esta na ultima (10). Nos dois casos, nada pode mudar na pasta.
      - name: Atualizar pelo develop (atualizar.sh) sem mexer em nada
        run: |
          antes="$(git rev-parse HEAD)"
          set +e
          env PATH="$PATH_LIMPO" bash scripts/geral/atualizar.sh 2>&1 | tee "$RUNNER_TEMP/atualizar.log"
          codigo=${PIPESTATUS[0]}
          set -e
          [[ $codigo -eq 2 || $codigo -eq 10 ]] || { echo "::error::atualizar.sh saiu com $codigo (esperado 2 fora do develop ou 10 ja na ultima)"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$antes" ]] || { echo "::error::atualizar.sh mudou o commit"; exit 1; }
          git diff --quiet || { echo "::error::atualizar.sh mexeu em arquivos"; exit 1; }

      - name: Diagnostico
        if: failure()
        run: |
          systemctl --user status financaslocal.service --no-pager || true
          journalctl --user -u financaslocal.service -n 80 --no-pager || true

      - name: Guardar logs da instalacao
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instalacao-linux-log
          path: ${{ runner.temp }}/instalacao-*.log
          if-no-files-found: ignore

  # #277: num Linux minimo de verdade (debian:stable-slim, sem nada alem do sistema base). O job acima reduz o PATH,
  # mas o runner continua trazendo bibliotecas (ICU, certificados, fontes) que um computador recem-instalado pode nao
  # ter. Aqui elas faltam de verdade: primeiro o script tem de dizer o que instalar; depois, so com o que ele disse,
  # tudo e baixado e compilado, e a API (com o Go atras) e o Go sozinho sobem. Sem systemd no conteiner, sobem a mao.
  minimo:
    name: instalar num Linux minimo (debian:stable-slim)
    runs-on: ubuntu-latest
    container: debian:stable-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sem as ferramentas basicas, o script diz o que instalar
        run: |
          if bash scripts/geral/1-preparar-ambiente.sh > "$RUNNER_TEMP/instalacao-minimo-0.log" 2>&1; then
            echo "::error::o 1-preparar-ambiente.sh passou sem curl nem unzip"; exit 1
          fi
          cat "$RUNNER_TEMP/instalacao-minimo-0.log"
          dica="$(grep -o 'apt install [a-z0-9 .-]*' "$RUNNER_TEMP/instalacao-minimo-0.log" | head -n1)"
          [[ -n "$dica" ]] || { echo "::error::o script nao disse o comando de instalar"; exit 1; }
          echo "DICA=$dica" >> "$GITHUB_ENV"

      - name: Instalar so o que o script disse
        run: |
          apt-get update -qq
          apt-get ${DICA#apt } -y --no-install-recommends

      - name: Instalacao do zero (instalar.sh, sem gerenciador)
        run: bash scripts/geral/instalar.sh --sem-gerenciador 2>&1 | tee "$RUNNER_TEMP/instalacao-minimo-1.log"

      - name: A API (com o Go atras) sobe sem o systemd
        run: |
          cd publicado/api
          ASPNETCORE_ENVIRONMENT=Production ../../ferramentas/dotnet/dotnet Financas.Api.dll > "$RUNNER_TEMP/instalacao-minimo-api.log" 2>&1 &
          for _ in $(seq 1 60); do curl -k -fsS https://127.0.0.1:5443/api/auth/estado && break; sleep 1; done
          curl -k -fsS https://127.0.0.1:5443/api/auth/estado || { echo "::error::a API nao subiu"; cat "$RUNNER_TEMP/instalacao-minimo-api.log"; exit 1; }
          for _ in $(seq 1 30); do grep -q 'Go no ar em' "$RUNNER_TEMP/instalacao-minimo-api.log" && break; sleep 1; done
          grep -q 'Go no ar em' "$RUNNER_TEMP/instalacao-minimo-api.log" || { echo "::error::o Go nao subiu atras da API"; cat "$RUNNER_TEMP/instalacao-minimo-api.log"; exit 1; }
          kill %1; wait || true

      - name: O Go sozinho sobe sem o systemd
        run: |
          cd publicado/api
          ./financas-go -aplicar-esquema -rotinas-de-partida > "$RUNNER_TEMP/instalacao-minimo-go.log" 2>&1 &
          for _ in $(seq 1 30); do curl -k -fsS https://127.0.0.1:5443/api/auth/estado && break; sleep 1; done
          curl -k -fsS https://127.0.0.1:5443/api/auth/estado || { echo "::error::o Go sozinho nao subiu"; cat "$RUNNER_TEMP/instalacao-minimo-go.log"; exit 1; }
          kill %1; wait || true

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instalacao-linux-minimo-log
          path: ${{ runner.temp }}/instalacao-minimo-*.log
          if-no-files-found: ignore
