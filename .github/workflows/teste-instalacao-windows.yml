# Testa o instalador do Windows (instalar-windows.cmd + scripts/windows/instalar-windows.ps1) num
# Windows de verdade, com o Windows PowerShell 5.1. O PATH e reduzido ao do Windows puro para
# esconder o dotnet/node/go/sqlite3 que ja vem no runner: assim o teste baixa tudo, como num
# computador novo. Nao cobre o pedido de elevacao (UAC): o runner ja roda como Administrador.
name: Teste de instalação no Windows

on:
  push:
    branches: [main, develop]
    paths:
      - instalar-windows.cmd
      - parar-windows.cmd
      - scripts/windows/**
      - scripts/geral/2-criar-banco.sh
      - banco/**
      - src/backend-go/go.mod
      - .github/workflows/teste-instalacao-windows.yml
  pull_request:
    branches: [main, develop]
    paths:
      - instalar-windows.cmd
      - parar-windows.cmd
      - scripts/windows/**
      - scripts/geral/2-criar-banco.sh
      - banco/**
      - src/backend-go/go.mod
      - .github/workflows/teste-instalacao-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teste-instalacao-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # PATH de um Windows sem nada instalado (curl.exe e robocopy.exe ficam em System32).
  PATH_WINDOWS_PURO: C:\Windows\System32;C:\Windows;C:\Windows\System32\Wbem;C:\Windows\System32\WindowsPowerShell\v1.0

jobs:
  instalar:
    name: instalar e atualizar
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalacao do zero (instalar-windows.ps1)
        shell: powershell
        run: |
          $env:PATH = $env:PATH_WINDOWS_PURO
          if (Get-Command dotnet, node, go, sqlite3 -ErrorAction SilentlyContinue) { throw "PATH ainda tem ferramentas do runner" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows\instalar-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Conferir instalacao
        shell: powershell
        run: |
          foreach ($p in "ferramentas\node\node.exe", "ferramentas\dotnet\dotnet.exe", "ferramentas\go\bin\go.exe", "ferramentas\sqlite\sqlite3.exe",
                         "dados\sql\FinancasLocal.db", "dados\chaves\financaslocal.pfx",
                         "publicado\api\Financas.Api.dll", "publicado\api\financas-go.exe", "publicado\api\wwwroot\index.html",
                         "publicado\api\appsettings.Production.json") {
            if (-not (Test-Path $p)) { throw "nao encontrado: $p" }
          }
          if ((Get-Service FinancasLocal).Status -ne "Running") { throw "servico FinancasLocal nao esta rodando" }
          curl.exe -k -fsS https://127.0.0.1:5443/api/auth/estado
          if ($LASTEXITCODE -ne 0) { throw "API nao respondeu" }
          # Sem -k: so passa se o certificado estiver nas Autoridades Raiz da maquina.
          # --ssl-no-revoke: certificado autoassinado nao tem lista de revogacao.
          curl.exe --ssl-no-revoke -fsS https://localhost:5443/api/auth/estado
          if ($LASTEXITCODE -ne 0) { throw "certificado nao e confiavel para o Windows" }

      # #231 (ADR 0049): o Go roda atras do .NET, como processo filho do servico (num Job Object), e responde pelo
      # repasse com o login do .NET.
      - name: Go atras do .NET (/api/go/saude)
        shell: powershell
        run: |
          $site = "https://127.0.0.1:5443"
          '{"login":"verificador","senha":"Teste#Win2026"}' | Set-Content corpo.json -NoNewline
          curl.exe -k -fsS -c c.txt -b c.txt "$site/api/auth/estado" | Out-Null
          $xsrf = (Get-Content c.txt | Where-Object { $_ -match "__Host-XSRF-TOKEN" } | ForEach-Object { ($_ -split "`t")[6] }) | Select-Object -Last 1
          curl.exe -k -fsS -c c.txt -b c.txt -H "X-XSRF-TOKEN: $xsrf" -H "Content-Type: application/json" -d "@corpo.json" "$site/api/auth/configurar" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "nao deu para criar o usuario" }
          $semLogin = curl.exe -k -s -o NUL -w "%{http_code}" "$site/api/go/saude"
          if ($semLogin -ne "401") { throw "GET /api/go/saude sem login: $semLogin (esperado 401)" }
          $saude = $null
          for ($i = 0; $i -lt 15; $i++) {
            $texto = curl.exe -k -fsS -b c.txt "$site/api/go/saude"
            if ($LASTEXITCODE -eq 0 -and $texto) { $saude = $texto | ConvertFrom-Json; break }
            Start-Sleep 2
          }
          if (-not $saude -or $saude.usuario -ne "verificador" -or $saude.diarioDoBanco -ne "wal") { throw "GET /api/go/saude: $texto" }
          $go = @(Get-CimInstance Win32_Process -Filter "Name='financas-go.exe'")
          if ($go.Count -ne 1) { throw "processos do Go: $($go.Count) (esperado 1)" }
          $pai = Get-CimInstance Win32_Process -Filter "ProcessId=$($go[0].ParentProcessId)"
          if ($pai.Name -ne "dotnet.exe") { throw "o pai do Go e $($pai.Name), e nao o dotnet.exe do servico" }
          "Go atras do .NET: $texto"
          $global:LASTEXITCODE = 0

      # Segunda execucao pelo .cmd: testa a atualizacao (backup do banco, copia da versao
      # anterior, servico parado antes da copia, certificado reaproveitado) e o proprio .cmd.
      - name: Atualizacao (instalar-windows.cmd)
        shell: cmd
        env:
          FINANCAS_SEM_INTERACAO: "1"
        run: |
          set "PATH=%PATH_WINDOWS_PURO%"
          call instalar-windows.cmd -PularBuild
          if errorlevel 1 exit /b 1
          dir /b backups\FinancasLocal-antes-instalacao-*.db || exit /b 1
          if not exist publicado\api-anterior\Financas.Api.dll exit /b 1
          powershell.exe -NoProfile -Command "if (-not (Select-String -Path instaladores\instalacao-windows.log -SimpleMatch 'certificado existente reaproveitado' -Quiet)) { exit 1 }" || exit /b 1
          curl.exe --ssl-no-revoke -fsS https://localhost:5443/api/auth/estado || exit /b 1

      # #468: o passo a passo do docs/OPERACAO.md: a copia volta, e o que veio depois dela sai.
      - name: Restaurar a copia (docs/OPERACAO.md)
        shell: powershell
        run: |
          $sqlite = "ferramentas\sqlite\sqlite3.exe"
          $banco = "dados\sql\FinancasLocal.db"
          $copia = Get-ChildItem backups\FinancasLocal-antes-instalacao-*.db | Sort-Object LastWriteTime | Select-Object -Last 1
          & $sqlite $banco "INSERT INTO Configuracao (Chave, Valor, AtualizadoEm) VALUES ('teste.depois-da-copia', 'x', '2026-01-01 00:00:00');"
          if ($LASTEXITCODE -ne 0) { throw "nao deu para gravar a marca no banco" }

          Stop-Service FinancasLocal
          New-Item -ItemType Directory -Force dadosntes-de-restaurar | Out-Null
          Copy-Item "$banco*" dadosntes-de-restaurar          Copy-Item $copia.FullName $banco -Force
          Remove-Item "$banco-wal", "$banco-shm" -ErrorAction SilentlyContinue
          Start-Service FinancasLocal

          foreach ($i in 1..30) {
            curl.exe --ssl-no-revoke -fsS https://localhost:5443/api/auth/estado
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 1
          }
          if ($LASTEXITCODE -ne 0) { throw "o site nao voltou depois de restaurar" }
          $marcas = & $sqlite $banco "SELECT COUNT(*) FROM Configuracao WHERE Chave = 'teste.depois-da-copia';"
          if ($marcas -ne "0") { throw "a copia nao voltou: $marcas marca(s) no banco" }
          $integridade = & $sqlite $banco "PRAGMA integrity_check;"
          if ($integridade -ne "ok") { throw "banco corrompido depois de restaurar: $integridade" }
          if (-not (Test-Path dadosntes-de-restaurar\FinancasLocal.db)) { throw "o banco de antes nao foi guardado" }

      # parar-windows.cmd (sem o UAC: o runner ja e Administrador): para, tira do inicio automatico e confere que
      # nada ficou de pe; depois o instalador sobe de novo e devolve o inicio automatico.
      - name: Parar (parar-windows.cmd -Desativar)
        shell: cmd
        env:
          FINANCAS_SEM_INTERACAO: "1"
        run: |
          set "PATH=%PATH_WINDOWS_PURO%"
          call parar-windows.cmd -Desativar > parar.log 2>&1
          set "CODIGO=%errorlevel%"
          type parar.log
          if not "%CODIGO%"=="0" exit /b 1
          powershell.exe -NoProfile -Command "$s = Get-Service FinancasLocal; Write-Host $s.Status $s.StartType; if ($s.Status -ne 'Stopped' -or $s.StartType -ne 'Manual') { exit 1 }" || exit /b 1
          findstr /c:"nenhum processo com o banco aberto" parar.log || exit /b 1
          powershell.exe -NoProfile -Command "if (Get-Process financas-go -ErrorAction SilentlyContinue) { Write-Host 'sobrou processo do Go'; exit 1 }" || exit /b 1
          curl.exe --ssl-no-revoke -fsS https://localhost:5443/api/auth/estado && exit /b 1
          exit /b 0

      - name: Subir de novo (instalar-windows.cmd)
        shell: cmd
        env:
          FINANCAS_SEM_INTERACAO: "1"
        run: |
          set "PATH=%PATH_WINDOWS_PURO%"
          call instalar-windows.cmd -PularBuild
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -Command "if ((Get-Service FinancasLocal).StartType -ne 'Automatic') { exit 1 }" || exit /b 1
          curl.exe --ssl-no-revoke -fsS https://localhost:5443/api/auth/estado || exit /b 1

      # ADR 0040: o atualizar-windows.ps1 e so para clone no develop. Em PR o checkout fica fora do develop (tem de
      # recusar, 2); no push do develop ja esta na ultima (10). Nos dois casos, nada pode mudar na pasta.
      - name: Atualizar pelo develop (atualizar-windows.ps1) sem mexer em nada
        shell: pwsh
        run: |
          $antes = git rev-parse HEAD
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\windows\atualizar-windows.ps1 -SoCodigo
          $codigo = $LASTEXITCODE
          if ($codigo -ne 2 -and $codigo -ne 10) { throw "atualizar-windows.ps1 saiu com $codigo (esperado 2 fora do develop ou 10 ja na ultima)" }
          if ((git rev-parse HEAD) -ne $antes) { throw "atualizar-windows.ps1 mudou o commit" }
          git diff --quiet; if ($LASTEXITCODE -ne 0) { throw "atualizar-windows.ps1 mexeu em arquivos" }
          exit 0

      - name: Diagnostico
        if: failure()
        shell: powershell
        run: |
          Get-Service FinancasLocal -ErrorAction SilentlyContinue | Format-List *
          Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match "NET|FinancasLocal|Service Control" } |
            Format-List TimeCreated, ProviderName, Message

      - name: Guardar log da instalacao
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instalacao-windows-log
          path: instaladores/instalacao-windows.log
          if-no-files-found: ignore
