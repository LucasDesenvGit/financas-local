name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #177: aviso (não bloqueia) quando o PR muda telas ou endpoints sem atualizar o Manual do site.
  manual:
    name: manual do site
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manual atualizado?
        env:
          BASE: ${{ github.base_ref }}
          CORPO_PR: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci/verificar-manual.py

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar API
        run: dotnet build FinancasLocal.sln -c Release

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Compilar front-end
        working-directory: src/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Testes do front-end (Jest)
        working-directory: src/frontend
        run: |
          npm run test:tipos
          npm test -- --ci

      - name: Conferir scripts SQL (idempotentes)
        run: python3 scripts/ci/verificar-sql.py

      - name: Aplicar schema num banco SQLite descartável
        run: |
          rm -f /tmp/ci-financaslocal.db
          sqlite3 /tmp/ci-financaslocal.db < banco/01-estrutura.sql
          sqlite3 /tmp/ci-financaslocal.db < banco/02-dados-iniciais.sql
