<!doctype html>
<html lang="pt-BR" data-tema="{{if .Escuro}}escuro{{else}}claro{{end}}"><head><meta charset="utf-8">
<title>Gerenciador do Finanças Local</title>
<link rel="stylesheet" href="/estilo.css">
</head><body>
<div class="raiz">
  <header class="cabecalho" aria-label="Finanças Local, gerenciador do site">
    <span class="moldura"><img src="/icone.png" alt=""></span>
    <div><strong>Finanças Local</strong><span>Gerenciador do site</span></div>
  </header>
  <main class="corpo">
    <section class="cartao" aria-label="Situação do site">
      <div class="situacao">
        <span id="ponto" class="ponto {{.Ponto}}" aria-hidden="true"></span>
        <div role="status" aria-live="polite"><p class="titulo" id="titulo">{{.Situacao.Titulo}}</p><p class="detalhe" id="detalhe"{{if not .Situacao.Detalhe}} hidden{{end}}>{{.Situacao.Detalhe}}</p></div>
      </div>
      <div class="linha">
        <button id="abrir" class="botao{{if .AbrirPrimario}} primario{{end}}" type="button" data-pagina="" accesskey="a"{{if not .AbrirHabilitado}} disabled{{end}}>{{icone "abrir"}}Abrir o site</button>
        <button id="ligar" class="botao{{if .LigarPrimario}} primario{{end}}" type="button" data-acao="{{.LigarAcao}}" accesskey="{{.LigarTecla}}"{{if not .LigarHabilitado}} disabled{{end}}>{{icone "ligar"}}<span id="texto-ligar">{{.LigarTexto}}</span></button>
        <button id="reiniciar" class="botao" type="button" data-acao="reiniciar" accesskey="r"{{if not .ReiniciarHabilitado}} disabled{{end}}>{{icone "reiniciar"}}Reiniciar</button>
      </div>
    </section>
    <section class="cartao" aria-labelledby="titulo-versao">
      <p class="subtitulo" id="titulo-versao">Versão</p>
      <p class="versao" id="versao"{{if not .Versao}} hidden{{end}}>{{.Versao}}</p>
      <div class="linha">
        {{if .PeloMsi}}<button class="botao" type="button" data-acao="procurar" accesskey="p">{{icone "procurar"}}Procurar versão nova</button>
        {{- else}}<button class="botao discreto" type="button" data-acao="baixar-msi" accesskey="b" aria-description="Abre a página da versão mais recente no GitHub">{{icone "baixar"}}Baixar o instalador .msi</button>{{end}}
      </div>
    </section>
    <button class="botao discreto mais" type="button" accesskey="m" aria-controls="painel-mais" aria-expanded="{{.MaisOpcoes}}"
      aria-label="{{if .MaisOpcoes}}Menos opções (esconder){{else}}Mais opções: cópia do banco, erros, manual e preferências{{end}}"
      >{{if .MaisOpcoes}}Menos opções ▴{{else}}Mais opções ▾{{end}}</button>
    <section class="cartao" id="painel-mais"{{if not .MaisOpcoes}} hidden{{end}}>
      <div class="linha"><button class="botao" type="button" data-acao="copia" accesskey="c">{{icone "salvar"}}Salvar uma cópia do banco…</button></div>
      <div class="linha">
        <span class="com-dica"><button id="erros" class="botao pagina-do-site" type="button" data-pagina="configuracoes?aba=erros" accesskey="e"{{if not .PaginasDoSiteHabilitadas}} disabled aria-describedby="dica-erros"{{end}}>{{icone "erros"}}Ver os erros do site</button><span id="dica-erros" class="dica" role="tooltip"{{if .PaginasDoSiteHabilitadas}} hidden{{end}}>{{dica}}</span></span>
        <span class="com-dica"><button id="manual" class="botao pagina-do-site" type="button" data-pagina="manual" accesskey="n"{{if not .PaginasDoSiteHabilitadas}} disabled aria-describedby="dica-manual"{{end}}>{{icone "manual"}}Abrir o manual</button><span id="dica-manual" class="dica" role="tooltip"{{if .PaginasDoSiteHabilitadas}} hidden{{end}}>{{dica}}</span></span>
      </div>
      <label class="interruptor"><input type="checkbox" role="switch" data-preferencia="iniciar" accesskey="i"{{if .IniciarComSistema}} checked{{end}}>Iniciar com o Windows (fica na área de notificação)</label>
      {{if .PeloMsi}}<label class="interruptor"><input type="checkbox" role="switch" data-preferencia="procurar" accesskey="v"{{if .ProcurarAoAbrir}} checked{{end}}>Procurar versão nova ao abrir</label>{{end}}
      <p class="rodape">Dados em {{.PastaDados}}. Endereço: {{.Endereco}}</p>
    </section>
  </main>
</div>
<!-- O resultado da cópia do banco, no desenho do gerenciador (e não a caixa do Windows): modal, prende o foco e
     fecha com Esc (showModal). -->
<dialog id="aviso" class="aviso" aria-labelledby="aviso-titulo" aria-describedby="aviso-mensagem">
  <div class="aviso-cabecalho"><span class="moldura"><img src="/icone.png" alt=""></span><strong>Finanças Local</strong></div>
  <div class="aviso-corpo">
    <span id="aviso-simbolo-sucesso" class="aviso-simbolo sucesso" aria-hidden="true">&#xE930;</span><span id="aviso-simbolo-alerta" class="aviso-simbolo alerta" aria-hidden="true" hidden>&#xE7BA;</span>
    <div>
      <h2 id="aviso-titulo"></h2>
      <dl id="aviso-local" hidden><dt>Arquivo</dt><dd id="aviso-arquivo"></dd><dt>Pasta</dt><dd id="aviso-pasta"></dd></dl>
      <p id="aviso-mensagem"></p>
    </div>
  </div>
  <div class="aviso-botoes">
    <button id="aviso-abrir-pasta" class="botao" type="button" hidden>{{icone "pasta"}}Abrir a pasta</button>
    <button id="aviso-ok" class="botao primario" type="button">OK</button>
  </div>
</dialog>
<script>
  var $ = function (id) { return document.getElementById(id); };
  // "Mais opções" abre e fecha o painel (padrão Disclosure da WAI-ARIA, como o _mais do C#).
  var mais = document.querySelector('.mais'), painel = $('painel-mais');
  mais.addEventListener('click', function () {
    painel.hidden = !painel.hidden;
    mais.setAttribute('aria-expanded', String(!painel.hidden));
    mais.textContent = painel.hidden ? 'Mais opções ▾' : 'Menos opções ▴';
    mais.setAttribute('aria-label', painel.hidden ? 'Mais opções: cópia do banco, erros, manual e preferências' : 'Menos opções (esconder)');
    ajustarAltura();
  });
  // Os botões pedem ao gerenciador, por dentro do programa (sem porta aberta): abrir uma página do site no navegador
  // ou uma ação. A situação nova chega pela consulta abaixo.
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button:not(:disabled)');
    if (!b) return;
    if (b.dataset.pagina !== undefined) fetch('/abrir?pagina=' + encodeURIComponent(b.dataset.pagina), { method: 'POST' });
    else if (b.dataset.acao === 'copia') fetch('/acao/copia', { method: 'POST' }).then(function (r) {
      if (r.status === 200) return r.json().then(mostrarAviso);
    });
    else if (b.dataset.acao) fetch('/acao/' + b.dataset.acao, { method: 'POST' }).then(atualizar);
  });
  var aviso = $('aviso');
  function mostrarAviso(a) {
    ['sucesso', 'alerta'].forEach(function (t) { $('aviso-simbolo-' + t).hidden = a.tipo !== t; });
    $('aviso-titulo').textContent = a.titulo;
    $('aviso-mensagem').textContent = a.mensagem;
    $('aviso-local').hidden = !a.arquivo;
    $('aviso-arquivo').textContent = a.arquivo || '';
    $('aviso-pasta').textContent = a.pasta || '';
    $('aviso-abrir-pasta').hidden = !a.arquivo;
    aviso.showModal();
    $('aviso-ok').focus();
  }
  $('aviso-ok').addEventListener('click', function () { aviso.close(); });
  $('aviso-abrir-pasta').addEventListener('click', function () {
    fetch('/acao/abrir-pasta', { method: 'POST' });
    aviso.close();
  });
  // As preferências valem na hora (por isso são interruptores, ADR 0032).
  document.addEventListener('change', function (e) {
    var p = e.target.dataset.preferencia;
    if (p) fetch('/preferencia/' + p + '?ligado=' + e.target.checked, { method: 'POST' });
  });
  function botao(b, habilitado, primario) { b.disabled = !habilitado; b.classList.toggle('primario', primario); }
  // A situação de agora, com as regras do gerenciador (GET /estado), nos elementos que já existem: o foco e o "Mais
  // opções" ficam como estão, e o leitor de tela anuncia o título só quando ele muda (role=status).
  function aplicar(e) {
    $('ponto').className = 'ponto ' + e.ponto;
    if ($('titulo').textContent !== e.titulo) $('titulo').textContent = e.titulo;
    if ($('detalhe').textContent !== e.detalhe) $('detalhe').textContent = e.detalhe;
    $('detalhe').hidden = !e.detalhe;
    botao($('abrir'), e.abrirHabilitado, e.abrirPrimario);
    var ligar = $('ligar');
    ligar.dataset.acao = e.ligarAcao;
    ligar.accessKey = e.ligarTecla;
    $('texto-ligar').textContent = e.ligarTexto;
    botao(ligar, e.ligarHabilitado, e.ligarPrimario);
    botao($('reiniciar'), e.reiniciarHabilitado, false);
    ['erros', 'manual'].forEach(function (id) {
      $(id).disabled = !e.paginasDoSite;
      if (e.paginasDoSite) $(id).removeAttribute('aria-describedby'); else $(id).setAttribute('aria-describedby', 'dica-' + id);
      $('dica-' + id).hidden = e.paginasDoSite;
    });
    $('versao').textContent = e.versao;
    $('versao').hidden = !e.versao;
    ajustarAltura();
  }
  function atualizar() { return fetch('/estado').then(function (r) { return r.json(); }).then(aplicar).catch(function () {}); }
  setInterval(atualizar, 1000);
  // A altura do conteúdo e a da área visível; o gerenciador soma a moldura e muda o tamanho da janela (POST /altura).
  // (No WebView2, o outerHeight é o da página, e não o da janela.) Só pede quando muda.
  var ultima = '';
  function ajustarAltura() {
    var medida = Math.ceil(document.querySelector('.raiz').getBoundingClientRect().bottom) + ' ' + window.innerHeight + ' ' + window.innerWidth;
    if (medida === ultima) return;
    ultima = medida;
    fetch('/altura', { method: 'POST', body: medida });
  }
  addEventListener('load', ajustarAltura);
</script>
</body></html>
